    bio_title: "Про художницю"
    bio: "Анна Войтюк — українська художниця-графік зі Львова. Працює переважно з авторською друкованою графікою, зокрема офортом, а також створює екслібриси та малу графіку. Її роботам властиві точність рисунка, висока деталізація, образи тварин, фантастичні й символічні мотиви та виразна візуальна оповідність."
