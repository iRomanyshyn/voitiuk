  about:
    title: "Про художницю"
    intro: "Анна Войтюк — українська художниця-графік зі Львова."
    biography_title: "Біографія"
    biography:
      - "Анна працює переважно з традиційними техніками авторської друкованої графіки, особливе місце серед яких посідає офорт. Також створює екслібриси, малу графіку та самостійні графічні серії."
      - "Важливе місце у її візуальній мові займають тварини. Вони постають і як реалістично трактовані образи, і як персонажі символічних, фантастичних та оповідних композицій. У творчості художниці поєднуються ретельний рисунок, технічна точність і зацікавлення виражальними можливостями друкованої графіки."
      - "Анна навчалася у Львівській дитячій художній школі імені Олекси Новаківського, продовжила освіту у Львівському вищому професійному художньому училищі, а 2022 року здобула ступінь бакалавра образотворчого мистецтва в Українській академії друкарства. Від 2025 року навчається на магістерській освітній програмі «Книжкова та станкова графіка» Інституту поліграфії та медійних технологій Національного університету «Львівська політехніка»."
      - "Її роботи брали участь у міжнародних виставках і конкурсах друкованої графіки, малої графіки та екслібриса. Серед відзнак — нагороди міжнародних конкурсів у Польщі, Литві, Болгарії, Іспанії та Аргентині, зокрема Prize for Young Artist на Sixth International Exlibris Competition Varna 2025."
      - "Окрім художньої практики, Анна бере участь у видавничих, освітніх і дослідницьких проєктах. У 2025 році в міжнародному тримовному виданні Ukrainian Exlibris after February 24, 2022: Glance from Japan опубліковано її статтю, присвячену порівнянню творчої спадщини Тараса Шевченка та Рембрандта ван Рейна."
    statement_title: "Текст художниці"
    statement:
      - "Я працюю переважно з авторською друкованою графікою, особливо з офортом, де фізичний процес рисунка, підготовки дошки й друку є невіддільним від кінцевого зображення."
      - "Важливе місце у моїй творчості займають тварини. В одних роботах я звертаюся до уважного спостереження й деталізації, в інших вони стають персонажами, символами або мешканцями уявних ситуацій. Мене цікавить момент, коли впізнаваний образ стає дивним, поетичним або трохи тривожним."
      - "Я ціную точність і повільність традиційної друкованої графіки. Лінія може бути надзвичайно контрольованою, проте сам процес друку завжди додає матеріальні властивості, яких неможливо досягти лише рисунком. Для мене важливий цей баланс між контролем і певною непередбачуваністю."
      - "Часто я працюю серіями, використовую графічну оповідність, повторювані мотиви та візуальні асоціації, щоб пов'язувати окремі відбитки у ширші художні світи. Поряд із самостійними роботами створюю екслібриси, де дуже малий формат має вмістити цілу історію про людину, книжку або ідею."
    name_title: "Написання імені"
    name_copy: "Основна латинська транслітерація прізвища — Voitiuk. У частині ранніх каталогів і публікацій трапляється варіант Vojtiuk."
