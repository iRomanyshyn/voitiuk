  about:
    title: "About"
    intro: "Anna Voitiuk is a Ukrainian printmaker and graphic artist based in Lviv."
    biography_title: "Biography"
    biography:
      - "Anna Voitiuk works primarily with traditional fine-art printmaking techniques, with a particular focus on etching, while also creating exlibris, small-format graphics and independent graphic series."
      - "Animals occupy an important place in her visual language. They appear both as realistically observed subjects and as characters within symbolic, surreal or narrative compositions. Her practice combines meticulous drawing, technical precision and a strong interest in the expressive possibilities of the printed line."
      - "Voitiuk studied at the Lviv Children's Art School named after Oleksa Novakivskyi, continued her education at the Lviv Higher Vocational Art School, and earned a bachelor's degree in Fine Arts from the Ukrainian Academy of Printing in 2022. Since 2025 she has continued her studies in the master's programme Book and Easel Graphics at the Institute of Printing and Media Technologies of Lviv Polytechnic National University."
      - "Her works have participated in international exhibitions and competitions devoted to printmaking, small graphic forms and exlibris. Her distinctions include prizes and awards in Ukraine, Poland, Lithuania, Bulgaria, Spain and Argentina, including the Prize for Young Artist at the Sixth International Exlibris Competition Varna in 2025."
      - "Alongside her studio practice, Voitiuk participates in publishing, educational and research projects. Her article comparing the creative legacies of Taras Shevchenko and Rembrandt van Rijn was published in the multilingual 2025 volume Ukrainian Exlibris after February 24, 2022: Glance from Japan."
    statement_title: "Artist statement"
    statement:
      - "I work primarily with printmaking, especially etching, where the physical process of drawing, preparing the plate and printing is inseparable from the final image."
      - "Animals are central to much of my work. Sometimes I approach them through observation and detail; in other works they become characters, symbols or inhabitants of imagined situations. I am interested in the point where something recognisable becomes strange, poetic or slightly unsettling."
      - "I value the precision and slowness of traditional printmaking. The line can be extremely controlled, yet the printing process always introduces material qualities that cannot be reduced to drawing alone. This balance between control and unpredictability is important to me."
      - "My work often develops through series. I use graphic narrative, recurring motifs and visual associations to connect individual prints into larger worlds. Alongside independent works, I create exlibris, where a very small format must contain an entire story about a person, a book or an idea."
    name_title: "Name and transliteration"
    name_copy: "The standard transliteration of the artist's surname is Voitiuk. The form Vojtiuk appears in some earlier catalogues and publications."
