- id: model-of-the-universe
  slug: model-of-the-universe
  title:
    en: "Model of the Universe"
    uk: "Модель Всесвіту"
  year: 2018
  technique:
    en: "Etching and aquatint"
    uk: "Офорт і акватинта"
  technique_code: "C3+C5"
  image: "/assets/img/works/model-of-the-universe.webp"
  thumbnail: "/assets/img/works/model-of-the-universe-960.webp"
  image_width: 1920
  image_height: 2972
  thumbnail_width: 960
  thumbnail_height: 1486
  alt:
    en: "Vertical black-and-white etching with a large fish crossing the waterline, a bull carrying a mountain and egg, and a serpent reaching from above."
    uk: "Вертикальний чорно-білий офорт із великою рибою на межі води, биком, що несе гору з яйцем, і змієм, який тягнеться згори."
  description:
    en: "One of Anna Voitiuk’s early works. In an elongated vertical composition, a large fish crosses the waterline. A bull stands upon the fish, carrying a mountain on its back; an egg rests on the summit, while a serpent reaches towards it from above. The composition is rich in fine details and varied textures."
    uk: "Одна з ранніх робіт Анни Войтюк. У витягнутій вертикальній композиції велика риба перетинає межу води. На рибі стоїть бик, який несе на спині гору; на вершині гори лежить яйце, до якого згори тягнеться змій. Композиція насичена дрібними деталями та різноманітними фактурами."

- id: kotoroka
  slug: kotoroka
  title: { en: "Kotoroka", uk: "Которока" }
  technique: { en: "Drypoint on plastic", uk: "Суха голка на пластику" }
  technique_code: "C4"
  plate_size: "12.5 × 17.5 cm"
  width_cm: 12.5
  height_cm: 17.5
  image: "/assets/img/works/kotoroka.jpg"
  thumbnail: "/assets/img/works/kotoroka-960.jpg"
  image_width: 1588
  image_height: 1588
  thumbnail_width: 960
  thumbnail_height: 960
  alt:
    en: "Black-and-white drypoint print of Kotoroka, a cat-magpie hybrid holding a rat by the tail."
    uk: "Чорно-білий відбиток у техніці сухої голки із Которокою — гібридом кота й сороки, що тримає щура за хвіст."
  description:
    en: "Kotoroka is an original handmade drypoint print depicting a surreal hybrid of a cat and a magpie. Half cat and half bird, the creature playfully holds a rat by the tail—curious, mischievous and elegant. The work brings together instinct and imagination, lightness and danger, embodying playful intelligence and the animal spirit of creation. For each impression, printing ink is applied to the plastic plate by hand, then the image is transferred to paper using a press. Subtle variations make every print unique."
    uk: "«Которока» — оригінальний авторський відбиток у техніці сухої голки із сюрреалістичною істотою — гібридом кота й сороки. Напівкіт-напівптах грайливо тримає щура за хвіст: допитливий, пустотливий і водночас елегантний. Робота поєднує інстинкт та уяву, легкість і небезпеку, втілюючи грайливий інтелект і тваринний дух творчості. Для кожного відбитка друкарську фарбу вручну наносять на пластикову пластину, після чого зображення переносять на папір за допомогою преса. Незначні відмінності роблять кожен відбиток унікальним."

- id: cat-bacchus
  slug: cat-bacchus
  title: { en: "Cat Bacchus", uk: "Кіт Бахус" }
  year: 2022
  technique: { en: "Etching", uk: "Офорт" }
  technique_code: "C3"
  plate_size: "17.5 × 16 cm"
  width_cm: 17.5
  height_cm: 16
  edition: 50
  image: "/assets/img/works/cat-bacchus.webp"
  thumbnail: "/assets/img/works/cat-bacchus-960.webp"
  image_width: 1588
  image_height: 1458
  thumbnail_width: 960
  thumbnail_height: 882
  alt:
    en: "Black-and-white etching of a reclining cat crowned with grapes, holding wine and using its claw in place of a gramophone needle."
    uk: "Чорно-білий офорт із котом у виноградному вінку, який лежить із келихом вина й використовує пазур замість голки грамофона."
  description:
    en: "Cat Bacchus is an original handmade etching depicting a playful, hedonistic cat—the feline spirit of Bacchus, god of wine and joy. The cat lounges with a glass of wine and produces sound from a gramophone by using one claw in place of its needle. The print combines humour, mythology and calmness in a small story about pleasure and self-indulgence. For each impression, printing ink is applied to the plate by hand, then the image is transferred to paper using a professional etching press. Subtle variations make every print unique."
    uk: "«Кіт Бахус» — оригінальний авторський офорт із грайливим котом-гедоністом, котячим утіленням Бахуса — бога вина й радості. Кіт ліниво відпочиває з келихом вина й відтворює звук із грамофона, використовуючи пазур замість голки. Робота поєднує гумор, міфологію та спокій у невеликій історії про насолоду й потурання власним бажанням. Для кожного відбитка друкарську фарбу вручну наносять на пластину, після чого зображення переносять на папір за допомогою професійного офортного преса. Незначні відмінності роблять кожен відбиток унікальним."
