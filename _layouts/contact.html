---
layout: base
---
{% assign locale = page.lang %}
{% assign t = site.data.content[locale].contact %}
<header class="page-hero shell"><p class="eyebrow">Anna Voitiuk</p><h1>{{ t.title }}</h1><p>{{ t.intro }}</p></header>
<section class="section shell contact-layout">
  <form class="contact-form" action="https://formspree.io/f/{{ site.formspree_form_id }}" method="POST" accept-charset="UTF-8">
    <div class="form-field"><label for="contact-name">{{ t.name }} <span aria-hidden="true">*</span><span class="sr-only">{{ t.required }}</span></label><input id="contact-name" name="name" type="text" autocomplete="name" required></div>
    <div class="form-field"><label for="contact-email">{{ t.email }} <span aria-hidden="true">*</span><span class="sr-only">{{ t.required }}</span></label><input id="contact-email" name="email" type="email" autocomplete="email" required></div>
    <div class="form-field"><label for="contact-message">{{ t.message }} <span aria-hidden="true">*</span><span class="sr-only">{{ t.required }}</span></label><textarea id="contact-message" name="message" rows="7" required></textarea></div>
    <input type="hidden" name="_subject" value="New message from voitiuk.com ({{ locale }})">
    <input class="honeypot" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button class="button" type="submit">{{ t.send }}</button>
  </form>
  <aside class="contact-direct"><h2>{{ t.direct }}</h2><a href="mailto:anna.vojtiuk@gmail.com">anna.vojtiuk@gmail.com</a><a href="https://www.instagram.com/voitiuk_print/" rel="me noopener noreferrer">Instagram @voitiuk_print</a><a href="https://www.facebook.com/anna.vojtyuk/" rel="me noopener noreferrer">Facebook Anna Vojtiuk</a><p>{{ site.data.content[locale].location }}</p></aside>
</section>
